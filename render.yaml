services:
  - type: web
    name: crucible-flexi-ca3
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CRUCIBLE_MOCK_LLM
        value: 0
      - key: GEMINI_API_KEY
        sync: false
